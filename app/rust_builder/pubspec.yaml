name: rust_lib
description: "Utility to build Rust code"
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffi: ^2.0.2
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    # `ffiPlugin` stays: this is also the crate the bridge loads, and the two are not exclusive —
    # the plugin class below is the preview's own channel, the FFI is the bridge's.
    platforms:
      android:
        ffiPlugin: true
        package: com.flutter_rust_bridge.rust_lib
        pluginClass: ScwcPreviewPlugin
      ios:
        pluginClass: ScwcPreviewPlugin
      linux:
        pluginClass: ScwcPreviewPlugin
      macos:
        pluginClass: ScwcPreviewPlugin
      windows:
        pluginClass: ScwcPreviewPlugin
