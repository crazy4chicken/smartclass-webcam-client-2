name: Release

# Packages the Flutter clients for every desktop platform plus an unsigned iOS
# build and the Android APK, and publishes them as GitHub release assets. Both
# `v*` and bare `X.Y.Z` tags trigger it, so a `1.0.0` builds the same release a
# `v1.0.0` would; manual runs name the tag explicitly and create it on
# `origin/main` if missing.
on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (created on origin/main if it does not exist)'
        required: true
        type: string
      force_update:
        description: 'Upload assets with --clobber when the release already exists'
        required: false
        type: boolean
        default: false

# All action references are pinned to a commit SHA; the comment carries the version.
# `contents: write` is needed to create the tag and to publish the release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: '3.47.7'

jobs:
  # Resolves the single tag this run builds, and makes sure it exists on the
  # remote so every build job can check it out by name (manual runs may name a
  # tag that has not been created yet).
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists."
          else
            git tag "${tag}" "$(git rev-parse origin/main)"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust (stable)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ("${{ matrix.arch }}" -eq "arm64") { rustup target add aarch64-pc-windows-msvc }

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      # Flutter publishes no Windows/Linux ARM64 SDK archives, so flutter-action
      # cannot resolve "architecture: arm64". Arm64 runners instead install the
      # SDK from a pinned git tag (it bootstraps the matching Dart SDK and engine
      # artifacts natively) and cache the whole SDK directory.
      - name: Install Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        id: flutter-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\flutter-sdk
          key: flutter-sdk-${{ env.FLUTTER_VERSION }}-windows-arm64

      - name: Install Flutter SDK (arm64, git clone)
        if: matrix.arch == 'arm64' && steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git C:\flutter-sdk

      - name: Bootstrap Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # GITHUB_PATH only applies to later steps, so call flutter by path here.
          echo "C:\flutter-sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          C:\flutter-sdk\bin\flutter.bat --version

      # Flutter desktop apps cannot be cross-built, so each architecture is
      # built on a matching native runner.
      - name: Build Flutter app (Windows, ${{ matrix.arch }})
        working-directory: app
        run: flutter build windows --release

      - name: Package bundle
        working-directory: app
        shell: pwsh
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $bundle = "build/windows/${{ matrix.arch }}/runner/Release"
          Compress-Archive -Path "$bundle/*" -DestinationPath "scwc-client-$env:TAG-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scwc-client-${{ needs.resolve.outputs.tag }}-windows-${{ matrix.arch }}.zip
          path: app/scwc-client-${{ needs.resolve.outputs.tag }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Install Inno Setup
        # Pinned via the Chocolatey package version (SHA pinning is not
        # available for choco).
        if: hashFiles('app/installer/windows/sc_webcam.iss') != ''
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer (Inno Setup)
        if: hashFiles('app/installer/windows/sc_webcam.iss') != ''
        shell: pwsh
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $ver = $env:TAG -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="$ver" /DArch="${{ matrix.arch }}" app\installer\windows\sc_webcam.iss
          if ($LASTEXITCODE -ne 0) {
            # ISCC failing is not the .zip's fault and not the build's fault — the
            # release still has the .zip to publish. Mark a warning, keep the
            # step green, let the upload step below note the missing artifact.
            Write-Host "::warning title=inno-setup::ISCC exited $LASTEXITCODE — the .zip is still uploaded; the setup.exe is not."
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scwc-client-${{ needs.resolve.outputs.tag }}-windows-${{ matrix.arch }}-setup.exe
          path: app/scwc-client-${{ needs.resolve.outputs.tag }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: warn

  linux:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install Linux system deps (Flutter desktop + VAAPI headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libva-dev

      # See the windows job for why arm64 cannot use flutter-action.
      - name: Install Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        id: flutter-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-sdk-${{ env.FLUTTER_VERSION }}-linux-arm64

      - name: Install Flutter SDK (arm64, git clone)
        if: matrix.arch == 'arm64' && steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git ~/flutter

      - name: Bootstrap Flutter SDK (arm64)
        if: matrix.arch == 'arm64'
        run: |
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          ~/flutter/bin/flutter --version  # GITHUB_PATH applies to later steps only

      - name: Build Flutter app (Linux, ${{ matrix.arch }})
        working-directory: app
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Build AppImage
        working-directory: app
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          bundle="build/linux/${{ matrix.arch }}/release/bundle"
          appdir="$PWD/AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir"
          cp -a "$bundle/." "$appdir/"
          # The bundle's entry point is the `sc_webcam` executable (BINARY_NAME
          # in linux/CMakeLists.txt).
          ln -sf sc_webcam "$appdir/AppRun"

          # Minimal 256x256 placeholder icon (AppDir/<Icon>.png is where
          # appimagetool looks), written straight as a PNG: zlib is in the
          # stdlib, so no image tooling is needed.
          python3 - <<'PY'
          import struct, zlib
          size = 256
          raw = b"".join(b"\x00" + bytes((0x1E, 0x6B, 0xFF, 0xFF)) * size for _ in range(size))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(raw, 9))
          png += chunk(b"IEND", b"")
          with open("AppDir/sc_webcam.png", "wb") as f:
              f.write(png)
          PY

          cat > "$appdir/scwc.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SC Webcam
          Exec=sc_webcam
          Icon=sc_webcam
          Categories=Utility;
          Terminal=false
          EOF

          # appimagetool only publishes a moving `continuous` tag (no versioned
          # or SHA-addressable release), so unlike the actions above it cannot be
          # pinned; the URL below is therefore mutable by upstream. Accepted
          # tradeoff: there is no pinned alternative distribution of AppImage
          # tooling for this arch pair.
          curl -sSfL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool

          # GitHub runners have no FUSE, so run the downloaded tool extracted.
          # ARCH selects the AppImage runtime packaged into the output.
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" \
            "scwc-client-${TAG}-linux-${{ matrix.arch }}.AppImage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scwc-client-${{ needs.resolve.outputs.tag }}-linux-${{ matrix.arch }}.AppImage
          path: app/scwc-client-${{ needs.resolve.outputs.tag }}-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  macos:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter app (macOS)
        working-directory: app
        run: flutter build macos --release

      - name: Package app bundle
        working-directory: app
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # The bundle name comes from macos/Runner/Configs/AppInfo.xcconfig
          # (PRODUCT_NAME = SC Webcam).
          # --keepParent keeps the .app directory as the zip's top-level entry.
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/SC Webcam.app" \
            "scwc-client-${TAG}-macos.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scwc-client-${{ needs.resolve.outputs.tag }}-macos.zip
          path: app/scwc-client-${{ needs.resolve.outputs.tag }}-macos.zip
          if-no-files-found: error

  ios:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The archive is deliberately unsigned: it must be re-signed with a
      # provisioning profile (and a distribution certificate) before it can be
      # installed on a device or submitted anywhere.
      - name: Build Flutter app (iOS, unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        working-directory: app
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          app_path="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -qry "scwc-client-${TAG}-ios-unsigned.ipa" Payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scwc-client-${{ needs.resolve.outputs.tag }}-ios-unsigned.ipa
          path: app/scwc-client-${{ needs.resolve.outputs.tag }}-ios-unsigned.ipa
          if-no-files-found: error

  android:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust (stable + android target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      # The runner image carries no Android SDK, so the toolchain this job names is installed
      # here: the NDK the app pins in app/build.gradle.kts, plus the platform and build-tools the
      # APK build needs. Everything lands under $HOME, so no sudo and no third-party action.
      - name: Install the Android SDK components
        run: |
          set -euo pipefail
          sdk="$HOME/android-sdk"
          ndk="${ANDROID_NDK_VERSION:-28.2.13676358}"
          mkdir -p "$sdk/cmdline-tools"
          curl -sSfL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools-extract
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          rm -rf "$sdk/cmdline-tools/latest"
          mv /tmp/cmdline-tools-extract/cmdline-tools "$sdk/cmdline-tools/latest"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk" --licenses > /dev/null || true
          "$sdkmanager" --sdk_root="$sdk" \
            "ndk;${ndk}" platform-tools "platforms;android-36" "build-tools;36.0.0"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_ROOT=$sdk/ndk/${ndk}"
          } >> "$GITHUB_ENV"

      - name: Cache the Android SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/android-sdk
          key: android-sdk-${{ runner.os }}-v1-ndk28.2.13676358

      - name: Point the cross toolchain at this runner's NDK
        run: |
          set -euo pipefail
          ndk="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${ndk}/clang++" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS=-C link-arg=--target=aarch64-linux-android21" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=${ndk}/clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${ndk}/llvm-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64_linux_android=--target=aarch64-linux-android21" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Unsigned release APK: an APK must be signed with a distribution key before it can be
      # installed outside a development device, and that key is not the repository's business.
      - name: Build the release APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scwc-client-${{ needs.resolve.outputs.tag }}-android.apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    needs: [resolve, windows, linux, macos, ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so name the repository explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$FORCE_UPDATE" != "true" ]; then
              echo "::error::Release $TAG already exists; re-run with force_update=true to overwrite its assets."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
